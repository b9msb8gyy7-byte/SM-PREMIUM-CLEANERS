<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Premium Cleaners</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --tag-transfer: #0284c7;
      --tag-cash: #b45309;
      --tag-mensal: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 40px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: var(--primary); }

    nav.tabs { display: flex; justify-content: space-around; background: #1e293b; padding: 6px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    nav.tabs button { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-muted); border-radius: 8px; transition: all 0.2s; }
    nav.tabs button.active { color: #fff; background: var(--primary); }

    .week-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #1e293b; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #334155; cursor: pointer; font-size: 13px; color: #fff; font-weight: 600; }
    .btn-primary { background: var(--primary); color: #0f172a; border: none; width: 100%; margin-bottom: 16px; padding: 12px; font-size: 15px; }

    .days-grid { display: flex; flex-direction: column; gap: 16px; }
    .day-column { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .day-title { font-weight: 700; font-size: 16px; color: var(--primary); }
    .day-stats { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .client-name { font-weight: 700; font-size: 16px; color: #fff; }
    .actions { display: flex; gap: 6px; }
    .btn-icon { border: 1px solid var(--border-color); background: #1e293b; cursor: pointer; font-size: 12px; color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

    .card-body { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; }
    .badge-transfer { background-color: var(--tag-transfer); }
    .badge-cash { background-color: var(--tag-cash); }
    .badge-mensal { background-color: var(--tag-mensal); }

    .workers-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); font-size: 12px; }
    .workers-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .worker-chip { background: #334155; color: #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; }
    .worker-chip.selected { background: var(--primary); color: #0f172a; }

    .team-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .team-table th, .team-table td { padding: 10px; border: 1px solid var(--border-color); text-align: left; font-size: 13px; }
    .team-table th { background: #0f172a; color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <h1>SM Premium Cleaners</h1>
  </header>

  <nav class="tabs">
    <button class="active" onclick="switchTab('agenda')">Agenda</button>
    <button onclick="switchTab('equipe')">Equipe</button>
    <button onclick="switchTab('visitas')">Visitas</button>
    <button onclick="switchTab('financeiro')">Financeiro</button>
  </nav>

  <!-- ABA AGENDA -->
  <div id="tab-agenda">
    <div class="week-bar">
      <button class="btn" onclick="changeWeek(-1)">◄</button>
      <strong id="week-label" style="font-size: 15px;">Semana 1</strong>
      <button class="btn" onclick="changeWeek(1)">►</button>
    </div>

    <button class="btn btn-primary" onclick="addNewClient()">+ Novo Agendamento</button>

    <div class="days-grid" id="days-container"></div>
  </div>

  <!-- ABA EQUIPE -->
  <div id="tab-equipe" style="display:none;">
    <div class="day-column">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Relatório da Equipe na Semana</h3>
      <table class="team-table">
        <thead>
          <tr>
            <th>Funcionário</th>
            <th>Taxa (£/h)</th>
            <th>Horas</th>
            <th>A Receber (£)</th>
          </tr>
        </thead>
        <tbody id="team-summary-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Carregar dados salvos ou inicializar com o JSON do utilizador
    let defaultData = {
      currentWeek: 1,
      teamMembers: [
        { name: "Roberta", rate: 15 },
        { name: "Lorruama", rate: 12.21 },
        { name: "Victor Hugo", rate: 12.21 }
      ],
      weeks: {
        1: {
          dates: "21/09 a 25/09",
          days: {
            "segunda": [
              { id: "ymdwvm3", name: "Bernadette", horario: "08:00", horarioFim: "10:30", hours: 10, value: 200, pay: "transfer", mensal: true, workers: ["Roberta", "Lorruama"] },
              { id: "mk68t9u", name: "Bushra", horario: "10:45", horarioFim: "11:45", hours: 4, value: 84, pay: "transfer", mensal: true, workers: ["Roberta", "Lorruama"] },
              { id: "nrp39bq", name: "Katrina", horario: "12:00", horarioFim: "13:15", hours: 5, value: 105, pay: "transfer", mensal: false, workers: ["Roberta"] },
              { id: "7om2tov", name: "Jessica", horario: "13:35", horarioFim: "14:20", hours: 3, value: 63, pay: "transfer", mensal: false, workers: [] },
              { id: "4293cb1", name: "Rachel Nova", horario: "14:40", horarioFim: "15:33", hours: 3.5, value: 73.5, pay: "cash", mensal: false, workers: [] }
            ],
            "terca": [
              { id: "451pa4c", name: "Rhiannon", horario: "08:00", horarioFim: "08:48", hours: 4, value: 84, pay: "cash", mensal: false, workers: [] },
              { id: "dqpmtce", name: "Sasha", horario: "09:00", horarioFim: "09:36", hours: 3, value: 63, pay: "cash", mensal: false, workers: ["Victor Hugo"] }
            ],
            "quarta": [], "quinta": [], "sexta": []
          }
        }
      }
    };

    let appData = JSON.parse(localStorage.getItem('sm_cleaners_v12')) || defaultData;

    function saveData() {
      localStorage.setItem('sm_cleaners_v12', JSON.stringify(appData));
    }

    function renderAgenda() {
      const weekNum = appData.currentWeek;
      if (!appData.weeks[weekNum]) {
        appData.weeks[weekNum] = { dates: "Semana Selecionada", days: { segunda: [], terca: [], quarta: [], quinta: [], sexta: [] } };
      }

      const weekData = appData.weeks[weekNum];
      document.getElementById('week-label').innerText = `Semana ${weekNum} (${weekData.dates || ''})`;

      const container = document.getElementById('days-container');
      container.innerHTML = '';

      const dayNames = ["segunda", "terca", "quarta", "quinta", "sexta"];
      
      dayNames.forEach(day => {
        const clients = weekData.days[day] || [];
        let totalHours = clients.reduce((acc, c) => acc + (parseFloat(c.hours) || 0), 0);
        let totalValue = clients.reduce((acc, c) => acc + (parseFloat(c.value) || 0), 0);

        let dayHtml = `
          <div class="day-column">
            <div class="day-header">
              <span class="day-title">${day.charAt(0).toUpperCase() + day.slice(1)}-feira</span>
              <span class="day-stats">${totalHours}h | £${totalValue.toFixed(2)}</span>
            </div>
        `;

        clients.forEach((client, idx) => {
          dayHtml += `
            <div class="card">
              <div class="card-header">
                <span class="client-name">${client.name}</span>
                <div class="actions">
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, -1)">▲</button>
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, 1)">▼</button>
                  <button class="btn-icon" onclick="deleteClient('${day}', ${idx})" style="color:#ef4444;">✕</button>
                </div>
              </div>
              <div class="card-body">
                <div>🕒 ${client.horario || '--:--'} | ⏱️ ${client.hours}h | £${client.value}</div>
                <div>
                  <span class="badge badge-${client.pay}">${client.pay}</span>
                  ${client.mensal ? '<span class="badge badge-mensal">MENSAL</span>' : ''}
                </div>
              </div>
              <div class="workers-section">
                <span style="color:var(--text-muted);">Trabalhou nesta casa:</span>
                <div class="workers-list">
                  ${appData.teamMembers.map(m => {
                    const isAssigned = (client.workers || []).includes(m.name);
                    return `<span class="worker-chip ${isAssigned ? 'selected' : ''}" onclick="toggleWorker('${day}',${idx}, '${m.name}')">${m.name}</span>`;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        });

        dayHtml += `</div>`;
        container.innerHTML += dayHtml;
      });
    }

    function moveClient(day, index, direction) {
      const list = appData.weeks[appData.currentWeek].days[day];
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= list.length) return;

      const temp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = temp;

      saveData();
      renderAgenda();
    }

    function toggleWorker(day, clientIdx, workerName) {
      const client = appData.weeks[appData.currentWeek].days[day][clientIdx];
      if (!client.workers) client.workers = [];
      
      const wIdx = client.workers.indexOf(workerName);
      if (wIdx > -1) {
        client.workers.splice(wIdx, 1);
      } else {
        client.workers.push(workerName);
      }

      saveData();
      renderAgenda();
      renderTeamSummary();
    }

    function deleteClient(day, idx) {
      if (confirm("Deseja remover este agendamento?")) {
        appData.weeks[appData.currentWeek].days[day].splice(idx, 1);
        saveData();
        renderAgenda();
        renderTeamSummary();
      }
    }

    function addNewClient() {
      const name = prompt("Nome do Cliente:");
      if (!name) return;
      const day = prompt("Dia da semana (segunda, terca, quarta, quinta, sexta):", "segunda").toLowerCase();
      const hours = prompt("Duração (em horas):", "3");
      const value = prompt("Valor (£):", "63");

      if (appData.weeks[appData.currentWeek].days[day]) {
        appData.weeks[appData.currentWeek].days[day].push({
          id: Math.random().toString(36).substr(2, 7),
          name: name,
          hours: parseFloat(hours) || 0,
          value: parseFloat(value) || 0,
          pay: "cash",
          workers: []
        });
        saveData();
        renderAgenda();
      }
    }

    function renderTeamSummary() {
      const tbody = document.getElementById('team-summary-body');
      tbody.innerHTML = '';

      const currentWeekDays = appData.weeks[appData.currentWeek]?.days || {};
      
      appData.teamMembers.forEach(member => {
        let memberHours = 0;

        Object.keys(currentWeekDays).forEach(day => {
          currentWeekDays[day].forEach(client => {
            if ((client.workers || []).includes(member.name)) {
              let workersCount = client.workers.length || 1;
              memberHours += (parseFloat(client.hours) || 0) / workersCount;
            }
          });
        });

        let totalPay = memberHours * member.rate;

        tbody.innerHTML += `
          <tr>
            <td><strong>${member.name}</strong></td>
            <td>£${member.rate.toFixed(2)}</td>
            <td>${memberHours.toFixed(2)}h</td>
            <td><strong style="color:var(--primary)">£${totalPay.toFixed(2)}</strong></td>
          </tr>
        `;
      });
    }

    function changeWeek(dir) {
      appData.currentWeek += dir;
      if (appData.currentWeek < 1) appData.currentWeek = 1;
      saveData();
      renderAgenda();
      renderTeamSummary();
    }

    function switchTab(tab) {
      document.getElementById('tab-agenda').style.display = (tab === 'agenda') ? 'block' : 'none';
      document.getElementById('tab-equipe').style.display = (tab === 'equipe') ? 'block' : 'none';
      
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    // Inicializar
    renderAgenda();
    renderTeamSummary();
  </script>
</body>
</html>
