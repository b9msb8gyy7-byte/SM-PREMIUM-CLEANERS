<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Premium Cleaners</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --tag-transfer: #0284c7;
      --tag-cash: #b45309;
      --tag-mensal: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 50px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: var(--primary); }

    nav.tabs { display: flex; justify-content: space-around; background: #1e293b; padding: 6px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border-color); overflow-x: auto; }
    nav.tabs button { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); border-radius: 8px; white-space: nowrap; }
    nav.tabs button.active { color: #fff; background: var(--primary); }

    .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .week-selector { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); }
    .btn-sub-tab { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: #334155; color: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn-sub-tab.active { background: var(--primary); color: #0f172a; }

    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #334155; cursor: pointer; font-size: 13px; color: #fff; font-weight: 600; }
    .btn-primary { background: var(--primary); color: #0f172a; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 8px; }

    .days-grid { display: flex; flex-direction: column; gap: 16px; }
    .day-column { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .day-title { font-weight: 700; font-size: 16px; color: var(--primary); }
    .day-stats { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .client-name { font-weight: 700; font-size: 16px; color: #fff; }
    .actions { display: flex; gap: 4px; }
    .btn-icon { border: 1px solid var(--border-color); background: #1e293b; cursor: pointer; font-size: 11px; color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

    .card-body { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .card-input-inline { width: 60px; background: #1e293b; border: 1px solid var(--border-color); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; text-align: center; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; cursor: pointer; }
    .badge-transfer { background-color: var(--tag-transfer); }
    .badge-cash { background-color: var(--tag-cash); }
    .badge-mensal { background-color: var(--tag-mensal); }

    .time-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; color: var(--text-muted); }
    .time-input { background: #1e293b; border: 1px solid var(--border-color); color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; width: 65px; text-align: center; }

    .time-per-person { font-size: 11px; color: var(--primary); margin-top: 4px; font-style: italic; }

    .workers-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); font-size: 12px; }
    .workers-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .worker-chip { background: #334155; color: #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; }
    .worker-chip.selected { background: var(--primary); color: #0f172a; }
    .worker-chip.owner { background: #d97706; color: #fff; }

    .team-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .team-table th, .team-table td { padding: 10px; border: 1px solid var(--border-color); text-align: left; font-size: 13px; }
    .team-table th { background: #0f172a; color: var(--primary); }

    .section-box { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

    /* VISITAS */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; display: block; letter-spacing: 0.5px; }
    .form-input, .form-textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 14px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-col { flex: 1; }

    .toggle-group { display: flex; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
    .toggle-btn { flex: 1; padding: 8px; background: #0f172a; color: var(--text-muted); border: none; cursor: pointer; font-weight: 600; font-size: 13px; text-align: center; }
    .toggle-btn.active { background: #1e3a5f; color: #38bdf8; font-weight: 700; }

    .counter-box { display: flex; align-items: center; justify-content: space-between; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 8px; }
    .counter-btn { width: 28px; height: 28px; background: #1e293b; border: 1px solid var(--border-color); color: #fff; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .bathroom-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    .btn-add-sub { width: 100%; padding: 8px; background: transparent; border: 1px dashed var(--border-color); color: var(--primary); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }

    .calc-row { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 10px; }
  </style>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>SM Premium Cleaners</h1>
    <div id="sync-status" style="font-size: 11px; color: var(--primary); margin-top: 4px;">🔄 Conectando em tempo real...</div>
  </header>

  <nav class="tabs">
    <button class="active" onclick="switchTab('agenda')">Agenda</button>
    <button onclick="switchTab('equipe')">Equipe</button>
    <button onclick="switchTab('visitas')">Visitas</button>
    <button onclick="switchTab('financeiro')">Financeiro</button>
    <button onclick="switchTab('backup')">Backup</button>
  </nav>

  <!-- ABA AGENDA -->
  <div id="tab-agenda">
    <div class="controls-bar">
      <div class="week-selector">
        <button class="btn-sub-tab active" id="sub-sem1" onclick="selectWeek('semana1')">Semana 1</button>
        <button class="btn-sub-tab" id="sub-sem2" onclick="selectWeek('semana2')">Semana 2</button>
        <button class="btn-sub-tab" id="sub-outros" onclick="selectWeek('outros')">Outros / Mensal</button>
      </div>
      <button class="btn btn-primary" onclick="addNewClient()">+ Novo Agendamento</button>
    </div>

    <div class="days-grid" id="days-container"></div>
  </div>

  <!-- ABA EQUIPE -->
  <div id="tab-equipe" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Relatório da Equipe na Semana Selecionada</h3>
      <table class="team-table">
        <thead>
          <tr>
            <th>Funcionário</th>
            <th>Taxa (£/h) / Função</th>
            <th>Horas Trabalhadas</th>
            <th>A Receber (£)</th>
          </tr>
        </thead>
        <tbody id="team-summary-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ABA VISITAS -->
  <div id="tab-visitas" style="display:none;">
    <div class="section-box" style="position: relative;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: var(--primary); font-size: 18px;">Nova Visita</h3>
        <button onclick="clearVisitForm()" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; font-weight:600;">remover / limpar</button>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label class="form-label">NOME</label>
          <input type="text" id="v-nome" class="form-input" placeholder="Nome do cliente">
        </div>
        <div class="form-col">
          <label class="form-label">ENDEREÇO</label>
          <input type="text" id="v-endereco" class="form-input" placeholder="Endereço">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">PRIORIDADES</label>
        <textarea id="v-prioridades" class="form-textarea" rows="2" placeholder="O que o cliente pediu pra priorizar..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label class="form-label">TEM PET?</label>
          <div class="toggle-group">
            <button id="btn-pet-sim" class="toggle-btn" onclick="setPet(true)">Sim</button>
            <button id="btn-pet-nao" class="toggle-btn active" onclick="setPet(false)">Não</button>
          </div>
        </div>
        <div class="form-col">
          <label class="form-label">TEM CRIANÇAS?</label>
          <div class="toggle-group">
            <button id="btn-criancas-sim" class="toggle-btn" onclick="setCriancas(true)">Sim</button>
            <button id="btn-criancas-nao" class="toggle-btn active" onclick="setCriancas(false)">Não</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label class="form-label">QUARTOS</label>
          <div class="counter-box">
            <button class="counter-btn" onclick="updateCounter('quartos', -1)">-</button>
            <span id="cnt-quartos" style="font-weight: bold;">0</span>
            <button class="counter-btn" onclick="updateCounter('quartos', 1)">+</button>
          </div>
        </div>
        <div class="form-col">
          <label class="form-label">LAVABO</label>
          <div class="counter-box">
            <button class="counter-btn" onclick="updateCounter('lavabo', -1)">-</button>
            <span id="cnt-lavabo" style="font-weight: bold;">0</span>
            <button class="counter-btn" onclick="updateCounter('lavabo', 1)">+</button>
          </div>
        </div>
        <div class="form-col">
          <label class="form-label">SALAS</label>
          <div class="counter-box">
            <button class="counter-btn" onclick="updateCounter('salas', -1)">-</button>
            <span id="cnt-salas" style="font-weight: bold;">0</span>
            <button class="counter-btn" onclick="updateCounter('salas', 1)">+</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">BANHEIROS (MÁX. 5)</label>
        <div id="bathrooms-container"></div>
        <button class="btn-add-sub" onclick="addBathroom()">+ adicionar banheiro</button>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label class="form-label">PISO</label>
        <div class="toggle-group" id="piso-toggle">
          <button class="toggle-btn active" onclick="setPiso('Piso', this)">Piso</button>
          <button class="toggle-btn" onclick="setPiso('Carpet', this)">Carpet</button>
          <button class="toggle-btn" onclick="setPiso('Madeira', this)">Madeira</button>
          <button class="toggle-btn" onclick="setPiso('Misto', this)">Misto</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label class="form-label">TEMPO ESTIMADO (1ª LIMPEZA)</label>
          <input type="text" id="v-tempo-1" class="form-input" placeholder="ex: 5h">
        </div>
        <div class="form-col">
          <label class="form-label">TEMPO COMBINADO (RECORRENTE)</label>
          <input type="number" id="v-tempo-comb" class="form-input" placeholder="ex: 3" oninput="calculateVisitTotal()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">VALOR POR HORA × TOTAL (LIGADOS)</label>
        <div class="calc-row">
          <input type="number" id="v-rate" class="form-input" style="width: 80px;" placeholder="£/HORA" oninput="calculateVisitTotal()">
          <span style="color:var(--text-muted);">× <span id="lbl-horas-comb">0</span> =</span>
          <strong style="font-size: 18px; color: var(--primary);" id="lbl-total-visita">£0.00</strong>
        </div>
      </div>

      <button class="btn btn-primary" onclick="saveVisit()" style="margin-top: 15px;">Salvar Visita</button>
    </div>

    <!-- LISTA DE VISITAS SALVAS -->
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Visitas Guardadas</h3>
      <div id="saved-visits-list"></div>
    </div>
  </div>

  <!-- ABA FINANCEIRO -->
  <div id="tab-financeiro" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Resumo Financeiro</h3>
      <div id="financial-summary" style="font-size: 14px; line-height: 1.8;"></div>
    </div>
  </div>

  <!-- ABA BACKUP -->

    <div class="section-box">

      <button class="btn" onclick="resetToInitialData()" style="background: #ef4444; border:none;">Restaurar Lista Inicial</button>
    </div>
  </div>

    function calculateEndTime(startTimeStr, totalHours, numPeople) {
      if (!startTimeStr) return "";
      let parts = startTimeStr.split(":");
      if (parts.length < 2) return "";
      
      let startH = parseInt(parts[0]) || 0;
      let startM = parseInt(parts[1]) || 0;

      let people = numPeople > 0 ? numPeople : 1;
      let actualDurationHours = (parseFloat(totalHours) || 0) / people;

      let durationMinutes = Math.round(actualDurationHours * 60);

      let totalStartMinutes = startH * 60 + startM + durationMinutes;
      let endH = Math.floor(totalStartMinutes / 60) % 24;
      let endM = totalStartMinutes % 60;

      let pad = (n) => n.toString().padStart(2, '0');
      return `${pad(endH)}:${pad(endM)}`;
    }

    function renderAgenda() {
      const container = document.getElementById('days-container');

      dayKeys.forEach(day => {
        const clients = currentWeekObj[day] || [];
        let totalHours = clients.reduce((acc, c) => acc + (parseFloat(c.hours) || 0), 0);
        let totalValue = clients.reduce((acc, c) => acc + (parseFloat(c.value) || 0), 0);

        let titleDisplay = (day === "outros") ? "Clientes Mensais / Outros" : day.charAt(0).toUpperCase() + day.slice(1) + "-feira";

        let dayHtml = `
          <div class="day-column">
            <div class="day-header">
              <span class="day-title">${titleDisplay}</span>
              <span class="day-stats">${totalHours}h | £${totalValue.toFixed(2)}</span>
            </div>
        `;

        clients.forEach((client, idx) => {
          let numWorkers = (client.workers || []).length;
          
          let computedEnd = calculateEndTime(client.horario, client.hours, numWorkers);
          if (computedEnd && (!client.horarioFim || client.autoTime !== false)) {
            client.horarioFim = computedEnd;
          }

          let timePerPersonText = "";
          if (numWorkers > 0) {
            let hoursPerPerson = (parseFloat(client.hours) || 0) / numWorkers;
            timePerPersonText = `➔ ${hoursPerPerson.toFixed(2)}h na casa (${numWorkers} ${numWorkers === 1 ? 'pessoa' : 'pessoas'})`;
          }

          dayHtml += `
            <div class="card">
              <div class="card-header">
                <span class="client-name">${client.name}</span>
                <div class="actions">
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, -1)">▲</button>
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, 1)">▼</button>
                  <button class="btn-icon" onclick="deleteClient('${day}', ${idx})" style="color:#ef4444;">✕</button>
                </div>
              </div>

              <div class="time-row">
                <span>🕒 Entrada:</span>
                <input type="text" class="time-input" value="${client.horario || ''}" placeholder="08:00" onchange="updateClientTime('${day}', ${idx}, 'horario', this.value)">
                <span>Saída:</span>
                <input type="text" class="time-input" value="${client.horarioFim || ''}" placeholder="10:30" onchange="updateClientTime('${day}', ${idx}, 'horarioFim', this.value)">
              </div>

              <div class="card-body">
                <div>
                  ⏱️ <input type="number" class="card-input-inline" value="${client.hours}" onchange="updateClientField('${day}', ${idx}, 'hours', this.value)"> h | 
                  £ <input type="number" class="card-input-inline" value="${client.value}" onchange="updateClientField('${day}', ${idx}, 'value', this.value)">
                </div>
                <div>
                  <span class="badge badge-${client.pay || 'cash'}" onclick="togglePayType('${day}', ${idx})">${client.pay || 'CASH'}</span>
                  <span class="badge ${client.mensal ? 'badge-mensal' : ''}" style="${!client.mensal ? 'background:#334155; color:#94a3b8;' : ''}" onclick="toggleMensal('${day}', ${idx})">MENSAL</span>
                </div>
              </div>

              ${timePerPersonText ? `<div class="time-per-person">${timePerPersonText}</div>` : ''}

              <div class="workers-section">
                <span style="color:var(--text-muted);">Trabalhou nesta casa:</span>
                <div class="workers-list">
                  ${appData.teamMembers.map(m => {
                    const isAssigned = (client.workers || []).includes(m.name);
                    const isOwnerClass = m.isOwner ? 'owner' : '';
                    return `<span class="worker-chip ${isAssigned ? 'selected ' + isOwnerClass : ''}" onclick="toggleWorker('${day}',${idx}, '${m.name}')">${m.name}</span>`;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        });

        dayHtml += `</div>`;
        container.innerHTML += dayHtml;
      });
    }

    function updateClientTime(day, idx, field, val) {
      appData.weeks[appData.selectedWeekKey][day][idx][field] = val;
      if (field === 'horarioFim') {
        appData.weeks[appData.selectedWeekKey][day][idx].autoTime = false;
      }

    function updateClientField(day, idx, field, val) {
      appData.weeks[appData.selectedWeekKey][day][idx][field] = parseFloat(val) || 0;

    function togglePayType(day, idx) {
      let current = appData.weeks[appData.selectedWeekKey][day][idx].pay || 'cash';
      appData.weeks[appData.selectedWeekKey][day][idx].pay = (current === 'cash') ? 'transfer' : 'cash';
      saveData();

    function toggleMensal(day, idx) {
      let current = appData.weeks[appData.selectedWeekKey][day][idx].mensal;
      appData.weeks[appData.selectedWeekKey][day][idx].mensal = !current;
      saveData();
    }

    function moveClient(day, index, direction) {
      const list = appData.weeks[appData.selectedWeekKey][day];
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= list.length) return;

      const temp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = temp;

      saveData();
    }

    function toggleWorker(day, clientIdx, workerName) {
      const client = appData.weeks[appData.selectedWeekKey][day][clientIdx];
      if (!client.workers) client.workers = [];
      
      const wIdx = client.workers.indexOf(workerName);
      if (wIdx > -1) {
        client.workers.splice(wIdx, 1);
      } else {
        client.workers.push(workerName);
      }

      saveData();
    }

    function renderTeamSummary() {
      const tbody = document.getElementById('team-summary-body');
      tbody.innerHTML = '';

      const currentWeekDays = appData.weeks[appData.selectedWeekKey] || {};
      
      let memberHoursMap = {};
      let memberPayMap = {};

      appData.teamMembers.forEach(m => {
        memberHoursMap[m.name] = 0;
        memberPayMap[m.name] = 0;
      });

      Object.keys(currentWeekDays).forEach(day => {
        (currentWeekDays[day] || []).forEach(client => {
          let assigned = client.workers || [];
          if (assigned.length === 0) return;

          let houseValue = parseFloat(client.value) || 0;
          let totalHours = parseFloat(client.hours) || 0;

          let normalWorkers = [];
          let ownersAssigned = [];

          assigned.forEach(wName => {
            let mObj = appData.teamMembers.find(t => t.name === wName);
            if (mObj && mObj.isOwner) ownersAssigned.push(wName);
            else normalWorkers.push(wName);
          });

          let hoursPerPerson = totalHours / assigned.length;

          let totalPaidToNormalWorkers = 0;
          normalWorkers.forEach(wName => {
            let mObj = appData.teamMembers.find(t => t.name === wName);
            let payForThisHouse = hoursPerPerson * mObj.rate;
            memberHoursMap[wName] += hoursPerPerson;
            memberPayMap[wName] += payForThisHouse;
            totalPaidToNormalWorkers += payForThisHouse;
          });

          let surplus = houseValue - totalPaidToNormalWorkers;

          if (ownersAssigned.length > 0) {
            let surplusPerOwner = surplus / ownersAssigned.length;
            ownersAssigned.forEach(oName => {
              memberHoursMap[oName] += hoursPerPerson;
              memberPayMap[oName] += surplusPerOwner;
            });
          } else {
            let surplusPerOwner = surplus / 2;
            memberPayMap["Suzana"] += surplusPerOwner;
            memberPayMap["Márcio"] += surplusPerOwner;
          }
        });
      });

      appData.teamMembers.forEach(member => {
        let h = memberHoursMap[member.name] || 0;
        let p = memberPayMap[member.name] || 0;
        let rateDisplay = member.isOwner ? `<span style="color:var(--accent)">Excedente / Empresa</span>` : `£${member.rate.toFixed(2)}`;

        tbody.innerHTML += `
          <tr>
            <td><strong>${member.name}</strong> ${member.isOwner ? '👑' : ''}</td>
            <td>${rateDisplay}</td>
            <td>${h.toFixed(2)}h</td>
            <td><strong style="color:var(--primary)">£${p.toFixed(2)}</strong></td>
          </tr>
        `;
      });
    }

              <button onclick="deleteVisit(${idx})" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; font-weight:600;">Remover</button>
            </div>
            <div style="font-size:13px; color:var(--text-muted); line-height:1.6;">
              <p>📍 <strong>Endereço:</strong> ${v.endereco || 'N/A'}</p>
              <p>📌 <strong>Prioridades:</strong> ${v.prioridades || 'N/A'}</p>
              <p>🐾 Pet: ${v.pet ? 'Sim' : 'Não'} | 👶 Crianças: ${v.criancas ? 'Sim' : 'Não'}</p>
              <p>🛏️ Quartos: ${v.quartos} | 🚪 Lavabo: ${v.lavabo} | 🛋️ Salas: ${v.salas} | 🚿 Banheiros: ${v.bathrooms ? v.bathrooms.length : 0}</p>
              <p>🪵 Piso: ${v.piso} | ⏱️ Combinado: ${v.tempoComb}h | 💰 Total: £${(v.total || 0).toFixed(2)}</p>
            </div>
          </div>
        `;
      });
    }

    function deleteVisit(idx) {
      if (confirm("Remover esta visita guardada?")) {
        appData.visits.splice(idx, 1);
        saveData();
      }
    }

    function switchTab(tab) {
      ['agenda', 'equipe', 'visitas', 'financeiro', 'backup'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.style.display = (t === tab) ? 'block' : 'none';
      });

      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "sm_cleaners_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function resetToInitialData() {
      if (confirm("Tem certeza que deseja restaurar a lista inicial no Firebase?")) {
        appData = exactListData;
        saveData();
      }
    }

    renderBathrooms();
  </script>
</body>
</html>
