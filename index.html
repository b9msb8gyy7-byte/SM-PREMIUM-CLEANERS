<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SM Premium Cleaners</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SM Cleaners">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/995/995053.png">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { background: var(--card); padding: 15px 20px; text-align: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    .nav-tabs { display: flex; background: var(--card); border-bottom: 1px solid #334155; position: sticky; top: 51px; z-index: 10; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: var(--subtext); font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .container { padding: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-weight: bold; color: var(--accent); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .badge-cash { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-transfer { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); color: white; margin-top: 5px; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    label { font-size: 0.85rem; color: var(--subtext); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>SM Premium Cleaners</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('agenda')">Agenda</button>
    <button class="tab-btn" onclick="switchTab('financeiro')">Financeiro</button>
    <button class="tab-btn" onclick="switchTab('equipe')">Equipe</button>
  </div>

  <div class="container">
    <!-- ABA AGENDA -->
    <div id="tab-agenda">
      <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="toggleForm()">+ Nova Faxina</button>
      
      <div id="job-form" class="card hidden">
        <h3 id="form-title" style="margin-bottom:10px;">Adicionar Agendamento</h3>
        <input type="hidden" id="job-id">
        <label>Cliente / Endereço</label>
        <input type="text" id="job-client" placeholder="Ex: Mr. Smith - 12 High St">
        
        <label>Dia da Semana</label>
        <select id="job-day">
          <option>Segunda-feira (Semana A)</option>
          <option>Terça-feira (Semana A)</option>
          <option>Quarta-feira (Semana A)</option>
          <option>Quinta-feira (Semana A)</option>
          <option>Sexta-feira (Semana A)</option>
          <option>Segunda-feira (Semana B)</option>
          <option>Terça-feira (Semana B)</option>
          <option>Quarta-feira (Semana B)</option>
          <option>Quinta-feira (Semana B)</option>
          <option>Sexta-feira (Semana B)</option>
        </select>

        <div class="grid-2">
          <div>
            <label>Valor Total (£)</label>
            <input type="number" id="job-price" placeholder="60">
          </div>
          <div>
            <label>Pagamento</label>
            <select id="job-payment">
              <option value="Cash">Cash</option>
              <option value="Transfer">Transfer</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Duração (Horas)</label>
            <input type="number" step="0.5" id="job-duration" placeholder="3">
          </div>
          <div>
            <label>Funcionário</label>
            <select id="job-worker">
              <option value="Roberta">Roberta</option>
              <option value="Lorruama">Lorruama</option>
              <option value="Victor Hugo">Victor Hugo</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary" onclick="saveJob()">Salvar Agendamento</button>
        <button class="btn" style="background:#334155; color:white;" onclick="toggleForm()">Cancelar</button>
      </div>

      <div id="jobs-list">
        <p style="text-align:center; color:var(--subtext); margin-top:20px;">Carregando agendamentos...</p>
      </div>
    </div>

    <!-- ABA FINANCEIRO -->
    <div id="tab-financeiro" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:15px;">Resumo Quinzenal</div>
        <div class="grid-2">
          <div class="stat-box">
            <div style="color:var(--subtext); font-size:0.8rem;">Total Faturado</div>
            <div class="stat-val" id="total-revenue" style="color:var(--success);">£0.00</div>
          </div>
          <div class="stat-box">
            <div style="color:var(--subtext); font-size:0.8rem;">Total em Cash</div>
            <div class="stat-val" id="total-cash" style="color:var(--warning);">£0.00</div>
          </div>
        </div>
        <div class="stat-box" style="margin-top:10px;">
          <div style="color:var(--subtext); font-size:0.8rem;">Total em Transferência</div>
          <div class="stat-val" id="total-transfer" style="color:var(--accent);">£0.00</div>
        </div>
      </div>
    </div>

    <!-- ABA EQUIPE -->
    <div id="tab-equipe" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:15px;">Horas e Pagamentos por Funcionário</div>
        <div id="team-stats">
          <p style="text-align:center; color:var(--subtext);">Carregando dados da equipe...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgqJMnBcwCI4eEEOS3wxa3uFrmcXMN9dA",
      authDomain: "cleaningapp-f7e58.firebaseapp.com",
      projectId: "cleaningapp-f7e58",
      storageBucket: "cleaningapp-f7e58.firebasestorage.app",
      messagingSenderId: "499257274532",
      appId: "1:499257274532:web:4dea74fe36d6258d793631"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let jobsData = [];

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).classList.remove('hidden');
    };

    window.toggleForm = function() {
      const form = document.getElementById('job-form');
      form.classList.toggle('hidden');
      if(form.classList.contains('hidden')) {
        document.getElementById('job-id').value = '';
        document.getElementById('job-client').value = '';
        document.getElementById('job-price').value = '';
        document.getElementById('job-duration').value = '';
      }
    };

    window.saveJob = async function() {
      const id = document.getElementById('job-id').value;
      const job = {
        client: document.getElementById('job-client').value,
        day: document.getElementById('job-day').value,
        price: parseFloat(document.getElementById('job-price').value) || 0,
        payment: document.getElementById('job-payment').value,
        duration: parseFloat(document.getElementById('job-duration').value) || 0,
        worker: document.getElementById('job-worker').value
      };

      if(!job.client) return alert('Por favor, informe o cliente.');

      if(id) {
        await updateDoc(doc(db, "jobs", id), job);
      } else {
        await addDoc(collection(db, "jobs"), job);
      }
      toggleForm();
    };

    window.deleteJob = async function(id) {
      if(confirm('Deseja excluir este agendamento?')) {
        await deleteDoc(doc(db, "jobs", id));
      }
    };

    window.editJob = function(id) {
      const job = jobsData.find(j => j.id === id);
      if(!job) return;
      document.getElementById('job-id').value = job.id;
      document.getElementById('job-client').value = job.client;
      document.getElementById('job-day').value = job.day;
      document.getElementById('job-price').value = job.price;
      document.getElementById('job-payment').value = job.payment;
      document.getElementById('job-duration').value = job.duration;
      document.getElementById('job-worker').value = job.worker;
      document.getElementById('job-form').classList.remove('hidden');
    };

    onSnapshot(collection(db, "jobs"), (snapshot) => {
      jobsData = [];
      snapshot.forEach((doc) => {
        jobsData.push({ id: doc.id, ...doc.data() });
      });
      renderJobs();
      renderFinance();
      renderTeam();
    });

    function renderJobs() {
      const list = document.getElementById('jobs-list');
      if(jobsData.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--subtext); margin-top:20px;">Nenhum agendamento cadastrado.</p>';
        return;
      }
      list.innerHTML = jobsData.map(j => `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${j.client}</span>
            <span class="badge ${j.payment === 'Cash' ? 'badge-cash' : 'badge-transfer'}">${j.payment}</span>
          </div>
          <div style="font-size:0.9rem; color:var(--subtext); margin-bottom:5px;">📅 ${j.day}</div>
          <div style="font-size:0.9rem; color:var(--subtext); margin-bottom:10px;">👤 ${j.worker} | ⏱️ ${j.duration}h | £${j.price}</div>
          <button class="btn" style="background:#334155; color:white; padding:6px;" onclick="editJob('${j.id}')">Editar</button>
          <button class="btn btn-danger" style="padding:6px;" onclick="deleteJob('${j.id}')">Excluir</button>
        </div>
      `).join('');
    }

    function renderFinance() {
      let total = 0, cash = 0, transfer = 0;
      jobsData.forEach(j => {
        total += j.price;
        if(j.payment === 'Cash') cash += j.price;
        else transfer += j.price;
      });
      document.getElementById('total-revenue').innerText = `£${total.toFixed(2)}`;
      document.getElementById('total-cash').innerText = `£${cash.toFixed(2)}`;
      document.getElementById('total-transfer').innerText = `£${transfer.toFixed(2)}`;
    }

    function renderTeam() {
      const rates = { "Roberta": 12, "Lorruama": 12, "Victor Hugo": 12 };
      const team = { "Roberta": 0, "Lorruama": 0, "Victor Hugo": 0 };
      
      jobsData.forEach(j => {
        if(team[j.worker] !== undefined) {
          team[j.worker] += j.duration;
        }
      });

      const teamContainer = document.getElementById('team-stats');
      teamContainer.innerHTML = Object.keys(team).map(worker => {
        const hours = team[worker];
        const pay = hours * rates[worker];
        return `
          <div style="padding:10px 0; border-bottom:1px solid #334155;">
            <div style="font-weight:bold; color:var(--accent);">${worker}</div>
            <div style="font-size:0.9rem; color:var(--subtext);">Horas trabalhadas: <strong>${hours}h</strong></div>
            <div style="font-size:0.9rem; color:var(--success);">Pagamento total: <strong>£${pay.toFixed(2)}</strong></div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
