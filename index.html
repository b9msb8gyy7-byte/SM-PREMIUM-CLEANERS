<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SM Premium Cleaners</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SM Cleaners">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/995/995053.png">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { background: var(--card); padding: 15px 20px; text-align: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    
    .nav-tabs { display: flex; background: var(--card); border-bottom: 1px solid #334155; position: sticky; top: 51px; z-index: 10; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 12px 10px; text-align: center; background: none; border: none; color: var(--subtext); font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 0.85rem; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    
    .week-selector { display: flex; gap: 10px; margin-bottom: 15px; }
    .week-btn { flex: 1; padding: 8px; background: #0f172a; border: 1px solid #334155; color: var(--subtext); border-radius: 6px; font-weight: bold; cursor: pointer; }
    .week-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .container { padding: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .day-header { font-size: 1rem; font-weight: bold; color: var(--accent); margin: 15px 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    
    .job-item { background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .job-info { flex: 1; }
    .job-title { font-weight: bold; color: var(--text); font-size: 0.95rem; }
    .job-sub { font-size: 0.8rem; color: var(--subtext); margin-top: 2px; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-cash { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-transfer { background: rgba(56, 189, 248, 0.2); color: var(--accent); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
    
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); color: white; margin-top: 5px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    label { font-size: 0.85rem; color: var(--subtext); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>SM Premium Cleaners</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('agenda')">Agenda</button>
    <button class="tab-btn" onclick="switchTab('financeiro')">Financeiro</button>
    <button class="tab-btn" onclick="switchTab('equipe')">Equipe</button>
    <button class="tab-btn" onclick="switchTab('visitas')">Visitas</button>
  </div>

  <div class="container">
    <!-- ABA AGENDA -->
    <div id="tab-agenda">
      <div class="week-selector">
        <button class="week-btn active" id="btn-sem1" onclick="setWeek('semana1')">Semana 1</button>
        <button class="week-btn" id="btn-sem2" onclick="setWeek('semana2')">Semana 2</button>
        <button class="week-btn" id="btn-outros" onclick="setWeek('outros')">Outros/Mensal</button>
      </div>

      <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="toggleForm()">+ Novo Agendamento</button>
      
      <div id="job-form" class="card hidden">
        <h3 style="margin-bottom:10px;">Agendamento</h3>
        <input type="hidden" id="job-id">
        <label>Cliente</label>
        <input type="text" id="job-client">
        
        <label>Semana</label>
        <select id="job-week">
          <option value="semana1">Semana 1</option>
          <option value="semana2">Semana 2</option>
          <option value="outros">Outros / Mensal</option>
        </select>

        <label>Dia da Semana</label>
        <select id="job-day">
          <option value="segunda">Segunda-feira</option>
          <option value="terca">Terça-feira</option>
          <option value="quarta">Quarta-feira</option>
          <option value="quinta">Quinta-feira</option>
          <option value="sexta">Sexta-feira</option>
        </select>

        <div class="grid-2">
          <div>
            <label>Valor (£)</label>
            <input type="number" id="job-price">
          </div>
          <div>
            <label>Pagamento</label>
            <select id="job-payment">
              <option value="transfer">Transfer</option>
              <option value="cash">Cash</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Horas</label>
            <input type="number" step="0.5" id="job-duration">
          </div>
          <div>
            <label>Horário Entrada</label>
            <input type="text" id="job-horario" placeholder="08:00">
          </div>
        </div>

        <button class="btn btn-primary" onclick="saveJob()">Salvar</button>
        <button class="btn" style="background:#334155; color:white;" onclick="toggleForm()">Cancelar</button>
      </div>

      <div id="jobs-container"></div>
    </div>

    <!-- ABA FINANCEIRO -->
    <div id="tab-financeiro" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:15px;">Resumo Financeiro (Semana Selecionada)</div>
        <div class="grid-2">
          <div class="stat-box">
            <div style="color:var(--subtext); font-size:0.8rem;">Total Faturado</div>
            <div class="stat-val" id="total-revenue" style="color:var(--success);">£0.00</div>
          </div>
          <div class="stat-box">
            <div style="color:var(--subtext); font-size:0.8rem;">Total em Cash</div>
            <div class="stat-val" id="total-cash" style="color:var(--warning);">£0.00</div>
          </div>
        </div>
        <div class="stat-box" style="margin-top:10px;">
          <div style="color:var(--subtext); font-size:0.8rem;">Total em Transferência</div>
          <div class="stat-val" id="total-transfer" style="color:var(--accent);">£0.00</div>
        </div>
      </div>
    </div>

    <!-- ABA EQUIPE -->
    <div id="tab-equipe" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:15px;">Horas e Pagamentos da Equipe</div>
        <div id="team-stats"></div>
      </div>
    </div>

    <!-- ABA VISITAS -->
    <div id="tab-visitas" class="hidden">
      <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="toggleVisitForm()">+ Nova Visita / Orçamento</button>
      
      <div id="visit-form" class="card hidden">
        <h3 style="margin-bottom:10px;">Detalhes da Visita</h3>
        <input type="hidden" id="visit-id">
        <label>Nome do Cliente</label>
        <input type="text" id="visit-client">
        
        <label>Endereço / Contato</label>
        <input type="text" id="visit-contact">

        <div class="grid-3">
          <div>
            <label>Quartos</label>
            <input type="number" id="visit-bedrooms" value="0">
          </div>
          <div>
            <label>Banheiros</label>
            <input type="number" id="visit-bathrooms" value="0">
          </div>
          <div>
            <label>Salas</label>
            <input type="number" id="visit-livingrooms" value="0">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Possui Pets?</label>
            <select id="visit-pets">
              <option value="Não">Não</option>
              <option value="Sim (Cão)">Sim (Cão)</option>
              <option value="Sim (Gato)">Sim (Gato)</option>
              <option value="Sim (Outros)">Sim (Outros)</option>
            </select>
          </div>
          <div>
            <label>Possui Crianças?</label>
            <select id="visit-kids">
              <option value="Não">Não</option>
              <option value="Sim">Sim</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Valor Proposto (£)</label>
            <input type="number" id="visit-price" placeholder="80">
          </div>
          <div>
            <label>Frequência</label>
            <select id="visit-freq">
              <option value="Semanal">Semanal</option>
              <option value="Quinzenal">Quinzenal</option>
              <option value="Mensal">Mensal</option>
              <option value="Uma vez">Uma vez</option>
            </select>
          </div>
        </div>

        <label>Observações / Requisitos</label>
        <textarea id="visit-notes" rows="3"></textarea>

        <button class="btn btn-primary" onclick="saveVisit()">Salvar Visita</button>
        <button class="btn" style="background:#334155; color:white;" onclick="toggleVisitForm()">Cancelar</button>
      </div>

      <div id="visits-list"></div>
    </div>
  </div>

      appData = JSON.parse(localStorage.getItem('sm_cleaners_data'));
    } else {

    }

    function saveState() {
      localStorage.setItem('sm_cleaners_data', JSON.stringify(appData));
    }

    let currentWeek = 'semana1';

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    function setWeek(week) {
      currentWeek = week;
      document.querySelectorAll('.week-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + (week === 'semana1' ? 'sem1' : week === 'semana2' ? 'sem2' : 'outros')).classList.add('active');
      renderJobs();
      renderFinance();
      renderTeam();
    }

    function toggleForm() {
      document.getElementById('job-form').classList.toggle('hidden');
    }

    function saveJob() {
      const id = document.getElementById('job-id').value;
      const week = document.getElementById('job-week').value;
      const day = document.getElementById('job-day').value;
      const client = document.getElementById('job-client').value;
      const price = parseFloat(document.getElementById('job-price').value) || 0;
      const payment = document.getElementById('job-payment').value;
      const duration = parseFloat(document.getElementById('job-duration').value) || 0;
      const horario = document.getElementById('job-horario').value;

      if(!client) return alert('Informe o cliente.');

      const newJob = { id: id || Date.now().toString(), client, price, payment, duration, horario };

      if(!appData.weeks[week]) appData.weeks[week] = {};
      if(!appData.weeks[week][day]) appData.weeks[week][day] = [];

      appData.weeks[week][day].push(newJob);
      saveState();
      toggleForm();
      renderJobs();
      renderFinance();
    }

    function deleteJob(week, day, id) {
      if(confirm('Excluir este agendamento?')) {
        appData.weeks[week][day] = appData.weeks[week][day].filter(j => j.id !== id);
        saveState();
        renderJobs();
        renderFinance();
      }
    }

    function renderJobs() {
      const container = document.getElementById('jobs-container');
      const weekData = appData.weeks[currentWeek] || {};
      const daysOrder = ["segunda", "terca", "quarta", "quinta", "sexta", "geral"];
      const dayNames = { segunda: "Segunda-feira", terca: "Terça-feira", quarta: "Quarta-feira", quinta: "Quinta-feira", sexta: "Sexta-feira", geral: "Lista Geral" };

      let html = '';
      daysOrder.forEach(day => {
        const dayJobs = weekData[day] || [];
        if(dayJobs.length > 0) {
          html += `<div class="day-header">${dayNames[day]}</div>`;
          dayJobs.forEach(j => {
            html += `
              <div class="job-item">
                <div class="job-info">
                  <div class="job-title">${j.client}</div>
                  <div class="job-sub">${j.horario ? '🕒 ' + j.horario + ' | ' : ''}⏱️ ${j.duration}h | £${j.price}</div>
                </div>
                <div>
                  <span class="badge ${j.payment.toLowerCase() === 'cash' ? 'badge-cash' : 'badge-transfer'}">${j.payment.toUpperCase()}</span>
                  <button style="background:none; border:none; color:var(--danger); margin-left:8px; font-weight:bold; cursor:pointer;" onclick="deleteJob('${currentWeek}', '${day}', '${j.id}')">✕</button>
                </div>
              </div>
            `;
          });
        }
      });
      container.innerHTML = html || '<p style="text-align:center; color:var(--subtext); margin-top:20px;">Nenhum agendamento cadastrado.</p>';
    }

    function renderFinance() {
      const weekData = appData.weeks[currentWeek] || {};
      let total = 0, cash = 0, transfer = 0;

      Object.keys(weekData).forEach(day => {
        weekData[day].forEach(j => {
          total += j.price;
          if(j.payment.toLowerCase() === 'cash') cash += j.price;
          else transfer += j.price;
        });
      });

      document.getElementById('total-revenue').innerText = `£${total.toFixed(2)}`;
      document.getElementById('total-cash').innerText = `£${cash.toFixed(2)}`;
      document.getElementById('total-transfer').innerText = `£${transfer.toFixed(2)}`;
    }

    function renderTeam() {

      const teamContainer = document.getElementById('team-stats');
      
      if(members.length === 0) {
        teamContainer.innerHTML = '<p style="text-align:center; color:var(--subtext);">Sem dados de equipe para esta seleção.</p>';
        return;
      }

      teamContainer.innerHTML = members.map(member => {
        const pay = member.hours * member.rate;
        return `
          <div style="padding:10px 0; border-bottom:1px solid #334155;">
            <div style="font-weight:bold; color:var(--accent);">${member.name} (£${member.rate.toFixed(2)}/h)</div>
            <div style="font-size:0.9rem; color:var(--subtext);">Horas trabalhadas: <strong>${member.hours.toFixed(2)}h</strong></div>
            <div style="font-size:0.9rem; color:var(--success);">Pagamento total: <strong>£${pay.toFixed(2)}</strong></div>
          </div>
        `;
      }).join('');
    }

    // VISITAS
    function toggleVisitForm() {
      document.getElementById('visit-form').classList.toggle('hidden');
    }

    function saveVisit() {
      const client = document.getElementById('visit-client').value;
      const contact = document.getElementById('visit-contact').value;
      const bedrooms = document.getElementById('visit-bedrooms').value;
      const bathrooms = document.getElementById('visit-bathrooms').value;
      const livingrooms = document.getElementById('visit-livingrooms').value;
      const pets = document.getElementById('visit-pets').value;
      const kids = document.getElementById('visit-kids').value;
      const price = document.getElementById('visit-price').value;
      const freq = document.getElementById('visit-freq').value;
      const notes = document.getElementById('visit-notes').value;

      if(!client) return alert('Informe o nome do cliente.');

      appData.visits.push({
        id: Date.now().toString(),
        client, contact, bedrooms, bathrooms, livingrooms, pets, kids, price, freq, notes
      });

      saveState();
      toggleVisitForm();
      renderVisits();
    }

    function deleteVisit(id) {
      if(confirm('Excluir esta visita?')) {
        appData.visits = appData.visits.filter(v => v.id !== id);
        saveState();
        renderVisits();
      }
    }

    function renderVisits() {
      const visitsList = document.getElementById('visits-list');
      let html = '';
      appData.visits.forEach(v => {
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="card-title">${v.client}</div>
              <button style="background:none; border:none; color:var(--danger); font-weight:bold; cursor:pointer;" onclick="deleteVisit('${v.id}')">✕</button>
            </div>
            <div style="font-size:0.85rem; color:var(--subtext); margin:5px 0;">📍 ${v.contact || 'Sem endereço'}</div>
            <div style="font-size:0.85rem; color:var(--accent); margin-bottom:8px;">
              🛏️ ${v.bedrooms} quart(s) | 🚿 ${v.bathrooms} banh(s) | 🛋️ ${v.livingrooms} sala(s)
            </div>
            <div style="font-size:0.85rem; color:var(--subtext); margin-bottom:8px;">
              🐾 Pets: ${v.pets} | 👶 Crianças: ${v.kids}
            </div>
            <div style="font-size:0.9rem; font-weight:bold; color:var(--success); margin-bottom:5px;">
              £${v.price || 0} (${v.freq})
            </div>
            ${v.notes ? `<div style="font-size:0.85rem; color:var(--subtext); font-style:italic;">"${v.notes}"</div>` : ''}
          </div>
        `;
      });
      visitsList.innerHTML = html || '<p style="text-align:center; color:var(--subtext);">Nenhuma visita registrada.</p>';
    }

    // Inicialização
    renderJobs();
    renderFinance();
    renderTeam();
    renderVisits();
  </script>
</body>
</html>
