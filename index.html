<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Premium Cleaners</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --tag-transfer: #0284c7;
      --tag-cash: #b45309;
      --tag-mensal: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 50px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: var(--primary); }

    nav.tabs { display: flex; justify-content: space-around; background: #1e293b; padding: 6px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border-color); overflow-x: auto; }
    nav.tabs button { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); border-radius: 8px; white-space: nowrap; }
    nav.tabs button.active { color: #fff; background: var(--primary); }

    .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .week-selector { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); }
    .btn-sub-tab { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: #334155; color: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn-sub-tab.active { background: var(--primary); color: #0f172a; }

    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #334155; cursor: pointer; font-size: 13px; color: #fff; font-weight: 600; }
    .btn-primary { background: var(--primary); color: #0f172a; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 8px; }

    .days-grid { display: flex; flex-direction: column; gap: 16px; }
    .day-column { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .day-title { font-weight: 700; font-size: 16px; color: var(--primary); }
    .day-stats { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .client-name { font-weight: 700; font-size: 16px; color: #fff; }
    .actions { display: flex; gap: 4px; }
    .btn-icon { border: 1px solid var(--border-color); background: #1e293b; cursor: pointer; font-size: 11px; color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

    .card-body { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; }
    .badge-transfer { background-color: var(--tag-transfer); }
    .badge-cash { background-color: var(--tag-cash); }
    .badge-mensal { background-color: var(--tag-mensal); }

    .workers-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); font-size: 12px; }
    .workers-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .worker-chip { background: #334155; color: #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; }
    .worker-chip.selected { background: var(--primary); color: #0f172a; }

    .team-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .team-table th, .team-table td { padding: 10px; border: 1px solid var(--border-color); text-align: left; font-size: 13px; }
    .team-table th { background: #0f172a; color: var(--primary); }

    .section-box { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header>
    <h1>SM Premium Cleaners</h1>
  </header>

  <nav class="tabs">
    <button class="active" onclick="switchTab('agenda')">Agenda</button>
    <button onclick="switchTab('equipe')">Equipe</button>
    <button onclick="switchTab('visitas')">Visitas</button>
    <button onclick="switchTab('financeiro')">Financeiro</button>
    <button onclick="switchTab('backup')">Backup</button>
  </nav>

  <!-- ABA AGENDA -->
  <div id="tab-agenda">
    <div class="controls-bar">
      <div class="week-selector">
        <button class="btn-sub-tab active" id="sub-sem1" onclick="selectWeek('semana1')">Semana 1</button>
        <button class="btn-sub-tab" id="sub-sem2" onclick="selectWeek('semana2')">Semana 2</button>
        <button class="btn-sub-tab" id="sub-outros" onclick="selectWeek('outros')">Outros / Mensal</button>
      </div>
      <button class="btn btn-primary" onclick="addNewClient()">+ Novo Agendamento</button>
    </div>

    <div class="days-grid" id="days-container"></div>
  </div>

  <!-- ABA EQUIPE -->
  <div id="tab-equipe" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Relatório da Equipe na Semana Selecionada</h3>
      <table class="team-table">
        <thead>
          <tr>
            <th>Funcionário</th>
            <th>Taxa (£/h)</th>
            <th>Horas Trabalhadas</th>
            <th>A Receber (£)</th>
          </tr>
        </thead>
        <tbody id="team-summary-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ABA VISITAS -->
  <div id="tab-visitas" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Visitas Agendadas</h3>
      <p style="color: var(--text-muted); font-size: 14px;">Nenhuma visita pendente no momento.</p>
    </div>
  </div>

  <!-- ABA FINANCEIRO -->
  <div id="tab-financeiro" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Resumo Financeiro</h3>
      <div id="financial-summary" style="font-size: 14px; line-height: 1.8;"></div>
    </div>
  </div>

  <!-- ABA BACKUP -->
  <div id="tab-backup" style="display:none;">
    <div class="section-box">
      <h3 style="color: var(--primary); margin-bottom: 12px;">Gerenciamento de Dados</h3>
      <button class="btn" onclick="exportJSON()" style="margin-right: 10px;">Exportar Dados (JSON)</button>
      <button class="btn" onclick="resetToInitialData()" style="background: #ef4444; border:none;">Restaurar Lista Atualizada</button>

    function saveData() {
      localStorage.setItem('sm_cleaners_v14', JSON.stringify(appData));
    }

    function selectWeek(weekKey) {
      appData.selectedWeekKey = weekKey;
      document.querySelectorAll('.week-selector button').forEach(btn => btn.classList.remove('active'));
      if (weekKey === 'semana1') document.getElementById('sub-sem1').classList.add('active');
      if (weekKey === 'semana2') document.getElementById('sub-sem2').classList.add('active');
      if (weekKey === 'outros') document.getElementById('sub-outros').classList.add('active');
      saveData();
      renderAgenda();
      renderTeamSummary();
      renderFinancialSummary();
    }

    function renderAgenda() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      const currentWeekObj = appData.weeks[appData.selectedWeekKey] || {};
      const dayKeys = (appData.selectedWeekKey === 'outros') ? ["outros"] : ["segunda", "terca", "quarta", "quinta", "sexta"];

      dayKeys.forEach(day => {
        const clients = currentWeekObj[day] || [];
        let totalHours = clients.reduce((acc, c) => acc + (parseFloat(c.hours) || 0), 0);
        let totalValue = clients.reduce((acc, c) => acc + (parseFloat(c.value) || 0), 0);

        let titleDisplay = (day === "outros") ? "Clientes Mensais / Outros" : day.charAt(0).toUpperCase() + day.slice(1) + "-feira";

        let dayHtml = `
          <div class="day-column">
            <div class="day-header">
              <span class="day-title">${titleDisplay}</span>
              <span class="day-stats">${totalHours}h | £${totalValue.toFixed(2)}</span>
            </div>
        `;

        clients.forEach((client, idx) => {
          dayHtml += `
            <div class="card">
              <div class="card-header">
                <span class="client-name">${client.name}</span>
                <div class="actions">
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, -1)">▲</button>
                  <button class="btn-icon" onclick="moveClient('${day}', ${idx}, 1)">▼</button>
                  <button class="btn-icon" onclick="deleteClient('${day}', ${idx})" style="color:#ef4444;">✕</button>
                </div>
              </div>
              <div class="card-body">
                <div>⏱️ ${client.hours}h | £${client.value}</div>
                <div>
                  <span class="badge badge-${client.pay || 'cash'}">${client.pay || 'CASH'}</span>
                  ${client.mensal ? '<span class="badge badge-mensal">MENSAL</span>' : ''}
                </div>
              </div>
              <div class="workers-section">
                <span style="color:var(--text-muted);">Trabalhou nesta casa:</span>
                <div class="workers-list">
                  ${appData.teamMembers.map(m => {
                    const isAssigned = (client.workers || []).includes(m.name);
                    return `<span class="worker-chip ${isAssigned ? 'selected' : ''}" onclick="toggleWorker('${day}',${idx}, '${m.name}')">${m.name}</span>`;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        });

        dayHtml += `</div>`;
        container.innerHTML += dayHtml;
      });
    }

    function moveClient(day, index, direction) {
      const list = appData.weeks[appData.selectedWeekKey][day];
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= list.length) return;

      const temp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = temp;

      saveData();
      renderAgenda();
    }

    function toggleWorker(day, clientIdx, workerName) {
      const client = appData.weeks[appData.selectedWeekKey][day][clientIdx];
      if (!client.workers) client.workers = [];
      
      const wIdx = client.workers.indexOf(workerName);
      if (wIdx > -1) {
        client.workers.splice(wIdx, 1);
      } else {
        client.workers.push(workerName);
      }

      saveData();
      renderAgenda();
      renderTeamSummary();
    }

    function deleteClient(day, idx) {
      if (confirm("Deseja remover este cliente?")) {
        appData.weeks[appData.selectedWeekKey][day].splice(idx, 1);
        saveData();
        renderAgenda();
        renderTeamSummary();
        renderFinancialSummary();
      }
    }

    function addNewClient() {
      const name = prompt("Nome do Cliente:");
      if (!name) return;
      const day = prompt("Dia da semana (segunda, terca, quarta, quinta, sexta):", "segunda").toLowerCase();
      const hours = prompt("Duração (horas):", "3");
      const value = prompt("Valor (£):", "63");

      if (appData.weeks[appData.selectedWeekKey][day]) {
        appData.weeks[appData.selectedWeekKey][day].push({
          id: Math.random().toString(36).substr(2, 7),
          name: name,
          hours: parseFloat(hours) || 0,
          value: parseFloat(value) || 0,
          pay: "cash",
          workers: []
        });
        saveData();
        renderAgenda();
        renderFinancialSummary();
      }
    }

    function renderTeamSummary() {
      const tbody = document.getElementById('team-summary-body');
      tbody.innerHTML = '';

      const currentWeekDays = appData.weeks[appData.selectedWeekKey] || {};
      
      appData.teamMembers.forEach(member => {
        let memberHours = 0;

        Object.keys(currentWeekDays).forEach(day => {
          (currentWeekDays[day] || []).forEach(client => {
            if ((client.workers || []).includes(member.name)) {
              let workersCount = client.workers.length || 1;
              memberHours += (parseFloat(client.hours) || 0) / workersCount;
            }
          });
        });

        let totalPay = memberHours * member.rate;

        tbody.innerHTML += `
          <tr>
            <td><strong>${member.name}</strong></td>
            <td>£${member.rate.toFixed(2)}</td>
            <td>${memberHours.toFixed(2)}h</td>
            <td><strong style="color:var(--primary)">£${totalPay.toFixed(2)}</strong></td>
          </tr>
        `;
      });
    }

    function renderFinancialSummary() {
      const finDiv = document.getElementById('financial-summary');
      const currentWeekDays = appData.weeks[appData.selectedWeekKey] || {};
      
      let totalCash = 0;
      let totalTransfer = 0;

      Object.keys(currentWeekDays).forEach(day => {
        (currentWeekDays[day] || []).forEach(c => {
          let val = parseFloat(c.value) || 0;
          if (c.pay === 'transfer') totalTransfer += val;
          else totalCash += val;
        });
      });

      let totalGeral = totalCash + totalTransfer;

      finDiv.innerHTML = `
        <p>💵 <strong>Dinheiro (Cash):</strong> £${totalCash.toFixed(2)}</p>
        <p>🏦 <strong>Transferência:</strong> £${totalTransfer.toFixed(2)}</p>
        <hr style="border-color:var(--border-color); margin: 10px 0;">
        <p style="font-size:16px; color:var(--primary);">💰 <strong>Faturamento Total:</strong> £${totalGeral.toFixed(2)}</p>
      `;
    }

    function switchTab(tab) {
      ['agenda', 'equipe', 'visitas', 'financeiro', 'backup'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.style.display = (t === tab) ? 'block' : 'none';
      });

      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "sm_cleaners_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function resetToInitialData() {
      if (confirm("Tem certeza que deseja restaurar com a lista completa atualizada?")) {
        appData = exactListData;
        saveData();
        renderAgenda();
        renderTeamSummary();
        renderFinancialSummary();
      }
    }

    // Inicializar
    selectWeek(appData.selectedWeekKey || 'semana1');
  </script>
</body>
</html>
